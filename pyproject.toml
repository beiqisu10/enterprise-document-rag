[project]
name = "enterprise-document-rag"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "chromadb>=1.5.9",
    "fastapi==0.141.1",
    "langchain-text-splitters>=1.1.2",
    "openai>=2.52.0",
    "pydantic-settings>=2.14.2",
    "pymupdf>=1.28.0",
    "python-dotenv>=1.2.2",
    "rank-bm25>=0.2.2",
    "sentence-transformers>=5.6.1",
    "starlette<0.48",
    "streamlit>=1.60.0",
    "uvicorn>=0.52.0",
]

[dependency-groups]
dev = [
    "jupyter>=1.1.1",
    "pandas>=3.0.5",
    "pytest>=9.1.1",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]